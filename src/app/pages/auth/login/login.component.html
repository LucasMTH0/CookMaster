<section class="container">
  <div class="form-container">
    <form
        (submit)="handleLogin()"
        [formGroup]="formLogin"
        class="form-container"
    >
        <label for="email">E-mail</label>
        <input
            id="email"
            class="form-control"
            formControlName="email"
        />

        <label for="password">Senha</label>
        <div style="display: flex; position: relative;">
            <input
                
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                formControlName="password"
            />
            <app-toggle-visibility-password-button (emitToggle)="togglePasswordVisibility()"></app-toggle-visibility-password-button>
        </div>
        <button class="form-submit" [disabled]="formLogin.invalid" >Entrar</button>
    </form>
  </div>
</section>
